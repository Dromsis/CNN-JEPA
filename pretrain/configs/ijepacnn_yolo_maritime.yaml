seed: 42

name: "I-JEPA-YOLO_{data_dataset_name}_{backbone_name}{backbone_scale}_predL{predictor_n_layers}K{predictor_kernel_size}_Mask{mask_strategy}_lr{optimizer_lr}_wd{optimizer_weight_decay}_bs{optimizer_batch_size}"
artifacts_root: "artifacts/pretrain_lightly/ijepacnn_yolo"

mask:
  strategy: "multi-block" # multi-block | random | mixed | variance-biased
  variance_bias_temp: 2.0
  mutli_block_kwargs:
    aspect_ratio: [0.75, 1.5]
    enc_mask_scale: [1.0, 1.0]
    min_keep: 5
    num_enc_blocks: 1
    num_pred_blocks: 4
    pred_mask_scale: [0.15, 0.2]
  mixed_mutli_block_ratio: 0.75

# NOTE: "lots of water" dataset. Start with this default and MEASURE first; only tune the
# mask (lower ratio, or variance-biased sampling) if the pretrained features are weak.
mask_ratio: 0.8

backbone:
  name: "yolo26_sea_backbone"
  scale: "s" # n | s
  pretrained_weights: null
  kwargs:
    # Path to the yolo26-sea.yaml in the local ultralytics copy:
    yaml_path: "ultralytics/cfg/models/26/yolo26-sea.yaml"
    scale: "s"
    # Repo root so the local `ultralytics` package is importable:
    yolo_repo_path: "."
    in_chans: 3

predictor:
  n_layers: 3
  kernel_size: 3
  dw_sep_conv: True
use_projection_head: True

# V-JEPA 2.1 dense/context loss: supervise the visible patches too (weighted by 1/sqrt(dist to
# the masked region), with a lambda warmup) so features stay spatially structured -> better for
# a DENSE downstream task like detection. See arXiv:2603.14482.
context_loss:
  enabled: true
  lambda: 0.5          # paper's best fixed weight; total loss = L_masked + lambda_eff * L_context
  warmup_epochs: 30    # ramp lambda 0 -> lambda over the first N epochs (paper warms ~50-100)

# V-JEPA 2.1 Deep Self-Supervision: also apply the JEPA loss at the trunk (layer-8) level, not
# only at the final output, so local structure flows toward the deeper layers. Adds an aux
# predictor whose target is the EMA encoder's trunk output. See arXiv:2603.14482 sec 2.3.2.
deep_supervision:
  enabled: true

variance_loss:
  enabled: true
  weight: 1.0


data:
  # Unlabeled pretraining on /data/combined/images/train (flat dir, ~121k images, 640px).
  dataset_name: "maritime"
  num_workers: 4
  # No labels -> the online linear-probe benchmark is meaningless and slow; keep it off.
  online_benchmark: false
  subsample: 2

trainer:
  max_epochs: 201
  devices: "auto"
  accelerator: "gpu"
  precision: "bf16"
  accumulate_grad_batches: null
  overfit_batches: 0.0

# Perf knobs (A100 80GB). channels_last: NHWC layout for tensor-core convs. compile:
# false | "dense" (teacher/tail/predictors only) | "all" (also the sparse student trunk).
# First step pays a few minutes of compile warmup; set compile: false when debugging
# stack traces. If TORCH_LOGS=recompiles shows churn on torch 2.0.x, use "dense".
# NOTE: start at "dense" for the first end-to-end run (safe, no global-cache-in-graph risk);
# switch to "all" once a few steps are confirmed stable and you want the extra trunk speedup.
perf:
  channels_last: true
  compile: "dense"

optimizer:
  # A100 80GB @ 640px. Measured: bs 192 -> peak 53 GiB (profile_step.py), so ~27 GiB headroom.
  # lr from the linear scaling rule off the known-good point (bs 64 / lr 0.001): 0.001*192/64.
  batch_size: 128
  lr: 0.001
  ema_momentum: 0.999
  weight_decay: 0.01
  cosine_warmpup_sched: True
  lr_warmup_epochs: 10
  exclude_norm_and_bias_from_wd: False
  wd_schedule: False

wandb: false

hydra:
  output_subdir: null
  run:
    dir: .
